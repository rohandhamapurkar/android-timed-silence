# Build debug APK — Samsung Galaxy S26 (base model, India)
#
# Target device profile:
#   Galaxy S26 (India retail) — Exynos 2600, arm64-v8a only, Android 16 (API 36).
# The project is minSdk 36 / targetSdk 36 and ships no native (.so) libraries, so a single
# universal APK is already the correct artifact for this device — no ABI splits needed.
#
# Debug is the variant to build here: it uses a persistent debug signing key, so
# the APK this produces installs straight onto the phone. (The release variant defines no
# signingConfig, so it would come out unsigned and refuse to install.)
name: Release Debug APK (Galaxy S26)

on:
  push:
    tags: ['**']

permissions:
  contents: write

concurrency:
  group: build-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Accepts SDK licenses so AGP can auto-download whatever platform/build-tools
      # the build requests (this project asks for API 36.1).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to "tools platform-tools", but the legacy
          # "tools" package is no longer available from the SDK repository.
          packages: platform-tools

      - name: Pre-install SDK packages (best effort)
        continue-on-error: true
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Restore persistent APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret before publishing an APK."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/timedsilence-debug.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "TIMEDSILENCE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./gradlew assembleDebug --stacktrace -PappVersion="$RELEASE_TAG"

      - name: Collect APK
        id: collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sha=$(git rev-parse --short HEAD)
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$apk" "artifacts/timedsilence-s26-debug-${sha}.apk"
          ls -lh artifacts
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Confirms the built APK matches the S26 profile (API 36+, arm64-v8a compatible).
      - name: Inspect APK
        continue-on-error: true
        run: |
          build_tools=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)
          apk=$(ls artifacts/*.apk | head -1)
          {
            echo "### Debug APK for Galaxy S26 (base, India)"
            echo ""
            echo "\`$(basename "$apk")\` — $(du -h "$apk" | cut -f1)"
            echo ""
            echo '```'
            "${build_tools}aapt2" dump badging "$apk" \
              | grep -E 'package:|sdkVersion|targetSdkVersion|native-code' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: timedsilence-debug-apk-${{ steps.collect.outputs.sha }}
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/*.apk --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/*.apk \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
